version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edunext-api
    ports:
      - "5050:5050"
    volumes:
      - .:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - DATABASE_URI=mongodb://admin:edunext_secret@mongo:27017/edunext?authSource=admin
    command: npm run dev
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7.0
    container_name: edunext-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: edunext_secret
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo "db.runCommand('ping').ok" | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  uploads_data:
  mongo_data:
